<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 64 64" fill="none" stroke="#fa4616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .bot { animation: float 3s ease-in-out infinite }
    .eye { fill: #38bdf8; stroke: none; transform-box: fill-box; transform-origin: center; animation: blink 4s infinite }
    .ant { fill: #fa4616; stroke: none; animation: pulse 1.2s ease-in-out infinite }
    @keyframes float { 50% { transform: translateY(-4px) } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1) } 96% { transform: scaleY(0.1) } }
    @keyframes pulse { 50% { opacity: 0.2 } }
  </style>
  <g class="bot">
    <line x1="32" y1="6" x2="32" y2="14"/>
    <circle class="ant" cx="32" cy="5" r="2.5"/>
    <rect x="12" y="14" width="40" height="30" rx="8"/>
    <circle class="eye" cx="24" cy="29" r="4"/>
    <circle class="eye" cx="40" cy="29" r="4"/>
    <line x1="25" y1="38" x2="39" y2="38"/>
    <line x1="6" y1="26" x2="6" y2="34"/>
    <line x1="58" y1="26" x2="58" y2="34"/>
    <path d="M20 44 v6 a4 4 0 0 0 4 4 h16 a4 4 0 0 0 4 -4 v-6"/>
  </g>
</svg>
