<svg xmlns="http://www.w3.org/2000/svg" width="920" height="190" font-family="'Segoe UI', Arial, sans-serif" viewBox="0 0 920 190"><style>@keyframes act{0%,28%{opacity:0}18%,6%{opacity:1}}.card{fill:#111827;stroke:#263041;stroke-width:1.5}.glow{fill:rgba(250,70,22,.1);stroke:#fa4616;stroke-width:2;opacity:0}.num,.title{font-weight:700}.num{font-family:Consolas,&apos;Courier New&apos;,monospace;font-size:13px;fill:#fa4616}.title{font-size:19px;fill:#fff}.desc{font-size:12px;fill:#9aa4b2}.flow{stroke:#fa4616;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:5 7;animation:dash .9s linear infinite}.head{fill:#fa4616}.g1{animation:act 5s infinite}.g2{animation:act 5s infinite 1s}.g3{animation:act 5s infinite 2s}.g4{animation:act 5s infinite 3s}.g5{animation:act 5s infinite 4s}</style><rect width="920" height="190" fill="#0b0f19" rx="18"/><g><rect width="140" height="130" x="20" y="30" class="card" rx="14"/><rect width="140" height="130" x="20" y="30" class="glow g1" rx="14"/><text x="38" y="58" class="num">01</text><text x="38" y="92" class="title">Trigger</text><text x="38" y="116" class="desc">Schedule or queue</text><text x="38" y="133" class="desc">starts the run</text></g><line x1="166" x2="198" y1="95" y2="95" class="flow"/><polygon points="200 95 192 90 192 100" class="head"/><g><rect width="140" height="130" x="205" y="30" class="card" rx="14"/><rect width="140" height="130" x="205" y="30" class="glow g2" rx="14"/><text x="223" y="58" class="num">02</text><text x="223" y="92" class="title">Collect</text><text x="223" y="116" class="desc">Read data from apps,</text><text x="223" y="133" class="desc">files and APIs</text></g><line x1="351" x2="383" y1="95" y2="95" class="flow"/><polygon points="385 95 377 90 377 100" class="head"/><g><rect width="140" height="130" x="390" y="30" class="card" rx="14"/><rect width="140" height="130" x="390" y="30" class="glow g3" rx="14"/><text x="408" y="58" class="num">03</text><text x="408" y="92" class="title">Process</text><text x="408" y="116" class="desc">Python cleans and</text><text x="408" y="133" class="desc">validates the data</text></g><line x1="536" x2="568" y1="95" y2="95" class="flow"/><polygon points="570 95 562 90 562 100" class="head"/><g><rect width="140" height="130" x="575" y="30" class="card" rx="14"/><rect width="140" height="130" x="575" y="30" class="glow g4" rx="14"/><text x="593" y="58" class="num">04</text><text x="593" y="92" class="title">Act</text><text x="593" y="116" class="desc">Click, type and</text><text x="593" y="133" class="desc">update systems</text></g><line x1="721" x2="753" y1="95" y2="95" class="flow"/><polygon points="755 95 747 90 747 100" class="head"/><g><rect width="140" height="130" x="760" y="30" class="card" rx="14"/><rect width="140" height="130" x="760" y="30" class="glow g5" rx="14"/><text x="778" y="58" class="num">05</text><text x="778" y="92" class="title">Report</text><text x="778" y="116" class="desc">Log results, alert</text><text x="778" y="133" class="desc">on exceptions</text></g></svg>