<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260">
  <style>
    text { font-family: Consolas, 'Courier New', monospace; font-size: 14px; fill: #c9d1d9 }
    .ts { fill: #4b5563 }
    .info { fill: #7dd3fc; font-weight: 700 }
    .ok { fill: #4ade80; font-weight: 700 }
    .dim { fill: #9aa4b2 }
    .bar { fill: #fa4616; transform-box: fill-box; transform-origin: left center; animation: fill 10s infinite }
    .cursor { fill: #fa4616; animation: blink 1s steps(1) infinite }
    .l1 { animation: l1 10s infinite }
    .l2 { animation: l2 10s infinite }
    .l3 { animation: l3 10s infinite }
    .l4 { animation: l4 10s infinite }
    .l5 { animation: l5 10s infinite }
    @keyframes l1 { 0%, 3% { opacity: 0 } 5%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
    @keyframes l2 { 0%, 14% { opacity: 0 } 16%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
    @keyframes l3 { 0%, 25% { opacity: 0 } 27%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
    @keyframes l4 { 0%, 45% { opacity: 0 } 47%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
    @keyframes l5 { 0%, 58% { opacity: 0 } 60%, 93% { opacity: 1 } 98%, 100% { opacity: 0 } }
    @keyframes fill { 0%, 27% { transform: scaleX(0) } 43%, 93% { transform: scaleX(1) } 98%, 100% { transform: scaleX(0) } }
    @keyframes blink { 50% { opacity: 0 } }
  </style>
  <rect width="920" height="260" rx="18" fill="#05080f"/>
  <rect x="0.75" y="0.75" width="918.5" height="258.5" rx="17.5" fill="none" stroke="#263041" stroke-width="1.5"/>
  <path d="M0 18a18 18 0 0 1 18-18h884a18 18 0 0 1 18 18v24H0z" fill="#0f172a"/>
  <circle cx="28" cy="21" r="6" fill="#ff5f56"/><circle cx="50" cy="21" r="6" fill="#ffbd2e"/><circle cx="72" cy="21" r="6" fill="#27c93f"/>
  <text class="dim" x="100" y="26" style="font-size:12px">robot@uipath ~ daily_report</text>

  <g class="l1">
    <text class="ts" x="28" y="82">[09:00:01]</text><text class="info" x="128" y="82">INFO</text><text x="182" y="82">Robot started · process: daily_report</text>
  </g>
  <g class="l2">
    <text class="ts" x="28" y="112">[09:00:04]</text><text class="info" x="128" y="112">INFO</text><text x="182" y="112">Fetched 1,248 queue items</text>
  </g>
  <g class="l3">
    <text class="ts" x="28" y="142">[09:03:42]</text><text class="info" x="128" y="142">INFO</text><text x="182" y="142">Processing items</text>
    <rect x="334" y="132" width="240" height="10" rx="5" fill="#1f2937"/>
    <rect class="bar" x="334" y="132" width="240" height="10" rx="5"/>
    <text class="dim" x="588" y="142">1,248 / 1,248</text>
  </g>
  <g class="l4">
    <text class="ts" x="28" y="172">[09:03:43]</text><text class="ok" x="128" y="172">OK</text><text x="182" y="172">0 exceptions · report sent</text>
  </g>
  <g class="l5">
    <text class="ok" x="28" y="222">$</text><text x="46" y="222">coffee --refill</text>
    <rect class="cursor" x="170" y="209" width="9" height="16"/>
  </g>
</svg>
